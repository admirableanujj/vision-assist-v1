server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;
    # Frontend Single Page Application Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to FastAPI. Uses host.docker.internal (the
    # bridge gateway, via docker-compose.yml's extra_hosts) rather than the
    # "backend" service hostname — direct container-to-container bridge
    # routing was observed broken in some environments; the published-port
    # path through the gateway was not.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme;       
    }

    # Proxy WebSocket connections (vision & audio streams)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;  # Adjust as needed for long-lived connections
    }
}