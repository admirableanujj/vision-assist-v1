# extra_hosts/host.docker.internal below: direct container-to-container
# bridge routing was observed broken in a constrained environment (GitHub
# Codespaces), while host-to-container via published ports worked fine.
# Routing through the gateway + published port instead of the internal
# service hostname sidesteps that without depending on a fix to it.
services:
  # --- Frontend React Client ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vision_assist_web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # --- FastAPI & ML Engine Orchestrator ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_assist_api
    image: visionassist_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/workspace
      - logs_storage:/workspace/logs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_HOST=vision_assist_llm_local
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      # - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password      
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-}
      - FINE_TUNED_YOLO_MODEL_PATH=${FINE_TUNED_YOLO_MODEL_PATH:-}
      - VISION_MODEL_TYPE=${VISION_MODEL_TYPE:-yolo}
      - VISION_CUSTOM_CLASSES=${VISION_CUSTOM_CLASSES:-}
      # - STT_PROVIDER=${STT_PROVIDER:-faster-whisper}
      - STT_PROVIDER=${STT_PROVIDER}
    secrets:
      - postgres_password
      - qdrant_api_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # --- Local LLM Server ---
  ollama:
    image: ollama/ollama:latest
    container_name: vision_assist_llm_local
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
# --- Automated Model Puller Sidecar ---
  ollama-puller:
    image: ollama/ollama:latest
    container_name: vision_assist_ollm_puller
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking/Pulling model 'llama3'..."
        ollama pull llama3
        echo "Model pull complete!"

  # --- Relational Database ---
  postgres:
    image: postgres:16-alpine
    container_name: vision_assist_db
    hostname: vision_assist_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB}
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vision_assist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Vector Database ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vision_assist_qdrant
    hostname: qdrant
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export QDRANT__SERVICE__API_KEY="$(cat /run/secrets/qdrant_api_key)"; exec ./entrypoint.sh'
    secrets:
      - qdrant_api_key
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_storage:
  postgres_storage:
  qdrant_storage:
  logs_storage:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  qdrant_api_key:
    file: ./secrets/qdrant_api_key.txt